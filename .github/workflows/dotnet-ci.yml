name: CI (.NET)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ChessSharp.sln

      - name: Build solution
        run: dotnet build ChessSharp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ChessSharp.sln --configuration Release --no-build --verbosity normal
