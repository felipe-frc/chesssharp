name: CI (.NET)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore ChessSharp.sln

      - name: Run tests with coverage
        run: dotnet test ChessSharp.sln --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity normal

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report and badge
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges"

          mkdir -p badges
          cp coveragereport/badge_linecoverage.svg badges/coverage.svg

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport
