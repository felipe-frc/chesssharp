name: CI (.NET)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'badges/coverage.svg'

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore ChessSharp.sln

      - name: Run tests with coverage
        run: dotnet test ChessSharp.sln --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity normal

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report and badge
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges"

          mkdir -p badges
          cp coveragereport/badge_linecoverage.svg badges/coverage.svg

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet badges/coverage.svg; then
            echo "Coverage badge is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push